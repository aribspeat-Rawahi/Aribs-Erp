<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARIBS ERP - Offline</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f9ec; color: #1f2a17; }
    .card { max-width: 320px; margin: 16px; padding: 28px 24px; background: #fff; border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center; }
    .dot { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; background: #7cb342; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #4b5a40; margin: 0 0 20px; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #558b2f; color: #fff;
             font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>No connection</h1>
    <p>ARIBS ERP needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
