<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARIBS ERP - Offline</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #F5F4EE; color: #152B1E; }
    .card { max-width: 320px; margin: 16px; padding: 28px 24px; background: #fff; border-radius: 28px;
            box-shadow: 12px 12px 28px rgba(21,43,30,.10), inset -6px -6px 14px rgba(0,0,0,.035), inset 6px 6px 14px rgba(255,255,255,.9); text-align: center; }
    .dot { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 18px; background: #8CC63F; box-shadow: 6px 6px 14px rgba(90,140,40,.3), inset -3px -3px 6px rgba(0,0,0,.15), inset 3px 3px 6px rgba(255,255,255,.5); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #6B766E; margin: 0 0 20px; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 16px; background: #8CC63F; color: #152B1E; box-shadow: 6px 6px 14px rgba(90,140,40,.3), inset -3px -3px 6px rgba(0,0,0,.15), inset 3px 3px 6px rgba(255,255,255,.5);
             font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>No connection</h1>
    <p>ARIBS ERP needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
