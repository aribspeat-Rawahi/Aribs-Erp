<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>ARIBS ERP - Offline</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: "Segoe UI", system-ui, sans-serif; background: #F5F4EE; color: #152B1E; }
    .card { width: 360px; padding: 32px 28px; background: #fff; border-radius: 28px;
            box-shadow: 12px 12px 28px rgba(21,43,30,.10), inset -6px -6px 14px rgba(0,0,0,.035), inset 6px 6px 14px rgba(255,255,255,.9); text-align: center; }
    .dot { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 18px; background: #8CC63F; box-shadow: 6px 6px 14px rgba(90,140,40,.3), inset -3px -3px 6px rgba(0,0,0,.15), inset 3px 3px 6px rgba(255,255,255,.5); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: #6B766E; margin: 0 0 20px; }
    button { width: 100%; padding: 11px; border: 0; border-radius: 16px; background: #8CC63F; color: #152B1E; box-shadow: 6px 6px 14px rgba(90,140,40,.3), inset -3px -3px 6px rgba(0,0,0,.15), inset 3px 3px 6px rgba(255,255,255,.5);
             font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #A6D86A; }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>Can't reach ARIBS ERP</h1>
    <p>Check your internet connection, then try again.</p>
    <button id="retry">Try again</button>
  </div>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      var target = new URLSearchParams(location.search).get('target') || '';
      // Only ever go back to an https address (the ERP site).
      if (/^https:\/\//i.test(target)) location.href = target;
    });
  </script>
</body>
</html>
